# Netlify build settings. Netlify's OpenNext adapter handles Next.js automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Public values only: these are bundled into the browser JavaScript anyway.
  # Row Level Security protects the data. Never put a secret key here.
  NEXT_PUBLIC_SUPABASE_URL = "https://owmpvvsakvvwugjkwgrz.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AwiIVAP0G00Dtq8u9yAleg_3LbtzThS"
  NEXT_PUBLIC_SITE_URL = "https://helpful-blini-71d112.netlify.app"
  # Old open tabs keep working after a deploy (avoids "Server Action not found").
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
